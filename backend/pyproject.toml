[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-app-backend"
version = "1.0.0"
description = "FastAPI backend for the Flow marketplace app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.51",
    "PyMySQL==1.1.1",
    "pydantic-settings==2.7.0",
    "cryptography==44.0.0",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
    "email-validator==2.3.0",
    "google-auth==2.56.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
